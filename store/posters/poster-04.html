<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: V; src: url("Vazirmatn-ExtraBold.ttf"); font-weight: 800; }
  @font-face { font-family: V; src: url("Vazirmatn-Regular.ttf"); font-weight: 400; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: V, sans-serif;
    color: #fff;
    background: linear-gradient(160deg, #005A63 0%, #008F83 100%);
    position: relative;
  }
  /* دو دایره‌ی کم‌رنگ — همان زبان بصری کارت‌های داخل اپ */
  .c1, .c2 { position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); }
  .c1 { width: 900px; height: 900px; left: -320px; top: 1280px; }
  .c2 { width: 520px; height: 520px; right: -200px; top: -180px; }

  .brand {
    position: absolute; top: 88px; right: 96px;
    display: inline-flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.28);
    border-radius: 999px; padding: 12px 26px 12px 22px;
    font-size: 30px; font-weight: 800;
  }
  .brand i { width: 14px; height: 14px; border-radius: 50%; background: #FFC52E; }

  .copy { position: absolute; top: 210px; right: 96px; left: 96px; }
  h1 { font-size: 92px; line-height: 1.25; font-weight: 800; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #FFC52E; }
  p  { margin-top: 26px; font-size: 38px; line-height: 1.6; color: rgba(255,255,255,.82); font-weight: 400; max-width: 820px; }

  .phone {
    position: absolute; left: 50%; top: 660px; transform: translateX(-50%);
    width: 760px; padding: 18px;
    background: #0E2A2E; border-radius: 74px;
    box-shadow: 0 60px 120px rgba(0,0,0,.42), 0 0 0 2px rgba(255,255,255,.12);
  }
  .screen { overflow: hidden; border-radius: 58px; padding-top: 96px; background: #F7FAF9; }
  /* نوار وضعیت شبیه‌ساز (ساعت و آیکون‌ها) بریده می‌شود؛ مال اپ نیست. */
  .phone img { display: block; width: 100%; }
  .phone::after { /* بریدگی دوربین */
    content: ""; position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 34px; border-radius: 20px; background: #0E2A2E;
  }

  .foot {
    position: absolute; bottom: 64px; right: 96px;
    font-size: 26px; color: rgba(255,255,255,.55);
  }
</style>
</head>
<body>
  <div class="c1"></div><div class="c2"></div>

  <div class="brand"><i></i>پول‌بین</div>

  <div class="copy">
    <h1>روزی چقدر<br><em>می‌توانی خرج کنی</em></h1>
    <p>سقف ماه را بده؛ پول‌بین قسط‌ها را کنار می‌گذارد و می‌گوید تا آخر ماه روزی چقدر مانده.</p>
  </div>

  <div class="phone"><div class="screen"><img src="shot-04.png" alt=""></div></div>
</body>
</html>
