buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// آینه‌های Google Maven.
//
// dl.google.com از این شبکه گاهی برای همه‌ی آدرس‌ها ۴۰۴ می‌دهد — حتی
// artifactهایی که قطعاً وجود دارند. تا وقتی همه‌چیز در کش ~/.gradle بود دیده
// نمی‌شد؛ اولین وابستگی تازه (androidx.biometric) بیلد را شکست. Gradle
// مخزن‌ها را به ترتیب امتحان می‌کند، پس google() اول می‌ماند و این‌ها فقط وقتی
// به کار می‌افتند که آن جواب ندهد.
allprojects {
    repositories {
        maven { url "https://maven.myket.ir" }
        maven { url "https://maven.aliyun.com/repository/google" }
    }
}
